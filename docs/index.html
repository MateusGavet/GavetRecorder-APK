    const aliases = {
      "en": "en",
      "pt": "pt",
      "pt-br": "pt",
      "es": "es",
      "fr": "fr",
      "de": "de",
      "it": "it",
      "ja": "ja",
      "ko": "ko",
      "zh": "zh",
      "zh-cn": "zh",
      "zh-hans": "zh",
      "ru": "ru",
      "ar": "ar"
    };

    function detectLanguage() {
      const browserLanguages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
      for (const raw of browserLanguages) {
        const lang = String(raw).toLowerCase();
        if (aliases[lang]) return aliases[lang];
        const base = lang.split("-")[0];
        if (aliases[base]) return aliases[base];
      }
      return "en";
    }

    function list(items) {
      return items.map(item => `<li>${item}</li>`).join("");
    }

    function steps(items) {
      return items.map(item => `<li>${item}</li>`).join("");
    }

    function render(lang) {
      const data = translations[lang] || translations.en;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

      const buttons = Object.entries(translations).map(([key, item]) => `
        <button onclick="render('${key}')" class="${key === lang ? "active" : ""}">
          ${item.label}
        </button>
      `).join("");

      document.getElementById("app").innerHTML = `
        <section class="hero">
          <h1>GavetRecorder APK</h1>
          <p class="subtitle">${data.subtitle}</p>
          <p class="muted">${data.description}</p>
          <div class="notice"><strong>${lang === "pt" ? "Importante" : "Important"}:</strong> ${data.important}</div>
          <div class="actions">
            <a class="linkbtn" href="https://github.com/MateusGavet/GavetRecorder-APK/raw/main/dist/GavetRecorder-v16-debug.apk">⬇️ ${data.download_direct}</a>
            <a class="linkbtn" href="https://mateusgavet.github.io/GavetRecorder-APK/">🌐 ${data.open_guide}</a>
          </div>
        </section>

        <section class="card">
          <h2>${data.languages}</h2>
          ${buttons}
        </section>

        <section class="card">
          <h2>${data.download}</h2>
          <p>${data.download_text}</p>
        </section>

        <section class="card">
          <h2>${data.requirements}</h2>
          <ul>${list(data.requirements_list)}</ul>
        </section>

        <section class="card">
          <h2>${data.install}</h2>
          <ol>${steps(data.install_steps)}</ol>
        </section>

        <section class="card">
          <h2>${data.permissions}</h2>
          <ul>${list(data.permissions_list)}</ul>
        </section>

        <section class="card">
          <h2>${data.usage}</h2>
          <ul>${list(data.usage_list)}</ul>
        </section>

        <section class="card">
          <h2>${data.storage}</h2>
          <p>${data.storage_text}</p>
          <pre><code>DCIM/GavetRecorder/
└── Videos/</code></pre>
        </section>

        <section class="card">
          <h2>${data.privacy}</h2>
          <p>${data.privacy_text}</p>
        </section>

        <section class="card">
          <h2>${data.troubleshooting}</h2>
          <ul>${list(data.troubleshooting_list)}</ul>
        </section>

        <section class="card">
          <h2>${data.adb}</h2>
          <pre><code>adb install -r app/build/outputs/apk/debug/app-debug.apk</code></pre>
        </section>

        <section class="card">
          <h2>${data.version}</h2>
          <p>${data.version_text}</p>
        </section>
      `;
    }

    render(detectLanguage());
  </script>
