    const aliases = {
      "pt": "pt",
      "pt-br": "pt",
      "es": "es",
      "fr": "fr",
      "de": "de",
      "it": "it",
      "ja": "ja",
      "ko": "ko",
      "zh": "zh",
      "zh-cn": "zh",
      "zh-hans": "zh",
      "ru": "ru",
      "ar": "ar"
    };

    function detectLanguage() {
      const browserLanguages = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || "en"];

      for (const raw of browserLanguages) {
        const lang = String(raw).toLowerCase();
        if (aliases[lang]) return aliases[lang];

        const base = lang.split("-")[0];
        if (aliases[base]) return aliases[base];
      }

      return "en";
    }

    function render(lang) {
      const data = translations[lang] || translations.en;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

      const buttons = Object.entries(translations).map(([key, item]) => `
        <button onclick="render('${key}')" class="${key === lang ? "active" : ""}">
          ${item.label}
        </button>
      `).join("");

      const features = data.features.map(item => `<li>${item}</li>`).join("");

      document.getElementById("app").innerHTML = `
        <h1>${data.title}</h1>
        <p><strong>${data.tagline}</strong></p>

        <div class="card">
          <p class="muted">Language / Idioma</p>
          ${buttons}
        </div>

        <div class="card">
          <h2>Objective</h2>
          <p>${data.objective}</p>
        </div>

        <div class="card">
          <h2>${data.features_title}</h2>
          <ul>${features}</ul>
        </div>

        <div class="card">
          <h2>${data.storage_title}</h2>
          <pre><code>DCIM/GavetRecorder/
├── Videos/
├── Mapas/
├── Rotas/
├── Logs/
└── Metadados/</code></pre>
        </div>

        <div class="card">
          <h2>${data.v16_title}</h2>
          <p>${data.v16}</p>
        </div>

        <div class="card">
          <h2>${data.build_title}</h2>
          <pre><code>./gradlew clean assembleDebug</code></pre>

          <h2>${data.install_title}</h2>
          <pre><code>adb install -r app/build/outputs/apk/debug/app-debug.apk</code></pre>
        </div>

        <p class="muted">${data.fallback}</p>
      `;
    }

    render(detectLanguage());
  </script>
