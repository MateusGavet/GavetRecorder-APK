    :root {
      color-scheme: dark;
      --bg: #0b0f19;
      --card: #151b2a;
      --card2: #101624;
      --border: #2b3548;
      --text: #f8fafc;
      --muted: #b6c2d2;
      --accent: #38bdf8;
      --accent2: #0ea5e9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(14,165,233,.18), transparent 32rem),
        var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 18px 80px;
    }
    .hero {
      padding: 34px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(21,27,42,.94), rgba(16,22,36,.94));
      box-shadow: 0 24px 70px rgba(0,0,0,.25);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.1rem, 6vw, 4rem);
      letter-spacing: -0.04em;
    }
    h2 {
      margin-top: 0;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 1.25rem;
      color: var(--accent);
      margin: 0 0 14px;
      font-weight: 700;
    }
    .muted { color: var(--muted); }
    .notice {
      margin-top: 20px;
      padding: 16px 18px;
      border-radius: 16px;
      background: rgba(56,189,248,.1);
      border: 1px solid rgba(56,189,248,.35);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 18px;
    }
    .card {
      padding: 24px;
      border-radius: 20px;
      background: rgba(21,27,42,.92);
      border: 1px solid var(--border);
    }
    .wide { grid-column: 1 / -1; }
    button {
      border: 1px solid #334155;
      background: #111827;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      margin: 4px;
      cursor: pointer;
    }
    button.active {
      background: var(--accent2);
      border-color: var(--accent);
      color: white;
    }
    ol, ul { padding-left: 1.3rem; }
    li { margin: 7px 0; }
    pre {
      margin: 0;
      overflow: auto;
      padding: 16px;
      border-radius: 14px;
      background: #020617;
      border: 1px solid #1e293b;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      color: #e2e8f0;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .linkbtn {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: white;
      background: var(--accent2);
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .hero { padding: 24px; }
    }
  </style>
</head>

    const aliases = {
      "en": "en",
      "pt": "pt",
      "pt-br": "pt",
      "es": "es",
      "fr": "fr",
      "de": "de",
      "it": "it",
      "ja": "ja",
      "ko": "ko",
      "zh": "zh",
      "zh-cn": "zh",
      "zh-hans": "zh",
      "ru": "ru",
      "ar": "ar"
    };

    function detectLanguage() {
      const browserLanguages = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || "en"];

      for (const raw of browserLanguages) {
        const lang = String(raw).toLowerCase();
        if (aliases[lang]) return aliases[lang];

        const base = lang.split("-")[0];
        if (aliases[base]) return aliases[base];
      }
      return "en";
    }

    function list(items) {
      return items.map(item => `<li>${item}</li>`).join("");
    }

    function steps(items) {
      return items.map((item, index) => `<li><strong>${index + 1}.</strong> ${item}</li>`).join("");
    }

    function render(lang) {
      const data = translations[lang] || translations.en;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

      const buttons = Object.entries(translations).map(([key, item]) => `
        <button onclick="render('${key}')" class="${key === lang ? "active" : ""}">
          ${item.label}
        </button>
      `).join("");

      document.getElementById("app").innerHTML = `
        <section class="hero">
          <h1>${data.title}</h1>
          <p class="subtitle">${data.subtitle}</p>
          <p class="muted">${data.description}</p>
          <div class="notice"><strong>APK:</strong> ${data.notice}</div>
          <div class="actions">
            <a class="linkbtn" href="../dist/GavetRecorder-v16-debug.apk">Download APK</a>
            <a class="linkbtn" href="../README.md">Repository README</a>
          </div>
        </section>

        <section class="card wide" style="margin-top:18px">
          <h2>Language</h2>
          ${buttons}
        </section>

        <section class="grid">
          <div class="card">
            <h2>${data.download}</h2>
            <p>${data.download_text}</p>
          </div>

          <div class="card">
            <h2>${data.requirements}</h2>
            <ul>${list(data.requirements_list)}</ul>
          </div>

          <div class="card wide">
            <h2>${data.install}</h2>
            <ol>${steps(data.install_steps)}</ol>
          </div>

          <div class="card">
            <h2>${data.permissions}</h2>
            <ul>${list(data.permissions_list)}</ul>
          </div>

          <div class="card">
            <h2>${data.usage}</h2>
            <ul>${list(data.usage_list)}</ul>
          </div>

          <div class="card">
            <h2>${data.storage}</h2>
            <p>${data.storage_text}</p>
            <pre><code>DCIM/GavetRecorder/
└── Videos/</code></pre>
          </div>

          <div class="card">
            <h2>${data.privacy}</h2>
            <p>${data.privacy_text}</p>
          </div>

          <div class="card wide">
            <h2>${data.troubleshooting}</h2>
            <ul>${list(data.troubleshooting_list)}</ul>
          </div>

          <div class="card wide">
            <h2>${data.adb}</h2>
            <pre><code>adb install -r app/build/outputs/apk/debug/app-debug.apk</code></pre>
          </div>

          <div class="card wide">
            <h2>${data.version}</h2>
            <p>${data.version_text}</p>
          </div>
        </section>
      `;
    }

    render(detectLanguage());
  </script>
